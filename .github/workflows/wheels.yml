name: wheels

# Builds the wheels (Geant4 linked in) and the source distribution and keeps
# them as workflow artifacts.  Nothing is uploaded to PyPI from here.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  wheels:
    name: wheel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        if: runner.os == 'macOS'
        with:
          path: ~/geant4
          key: geant4-11.4.1-${{ matrix.os }}-${{ hashFiles('ci/build_geant4.sh') }}
      - uses: pypa/cibuildwheel@v4.3.5
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  test:
    # the full test suite on each built wheel, with the Geant4 data sets cached
    name: test ${{ matrix.os }}
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse
      - uses: actions/cache@v6
        with:
          path: ~/.lighthit-g4/geant4-data
          key: geant4-data-11.4.1-${{ runner.os }}
      - name: install
        run: |
          python -m pip install "$(ls wheelhouse/*.whl)[test]"
          python -m pip install pythia8mc || echo "pythia8mc not available: Pythia tests are skipped"
          python -m pip install lighthit || echo "lighthit not available: the LightHit reading test is skipped"
      - name: pytest
        env:
          LIGHTHIT_G4_INSTALLED: "1"
        run: python -m pytest -q tests

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
